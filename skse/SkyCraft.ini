; SkyCraft: Skyrim with Minecraft physics, inventory and blocks.
; Goes in Data\SKSE\Plugins\ next to SkyCraft.dll.

[Minecraft]
; Start Minecraft when Skyrim starts. It stays hidden (no window, no music), opens its SkyCraft world
; by itself once you're in game, and quits when Skyrim closes. 0 = start Minecraft yourself.
bStartWithSkyrim = 1

; Empty: the Minecraft that comes with SkyCraft (a portable Prism Launcher, unpacked to
; %LOCALAPPDATA%\SkyCraft; the first time it asks you to sign in with your Microsoft account).
; Or the full path of your own launcher (Prism, MultiMC, or a .bat file) to use that instead.
sLauncher =

; What to pass to your own launcher. For Prism: --launch and the SkyCraft instance's folder name.
sArguments = --launch SkyCraft

[Controls]
; Extra keys that go to Skyrim instead of Minecraft, so Skyrim's own menus open while Minecraft
; drives the player: Tab (Skyrim's menu: skills, level up, map, items, magic), I (inventory),
; P (magic). They open whatever Skyrim binds them to. Letters, digits, F1-F12, Tab, or a scan
; code like 0x0F, separated by commas. Empty: only Esc, ~, J, M and F9 go to Skyrim.
; (In Minecraft, Tab is the player list and P the social screen; both only matter in multiplayer.)
sSkyrimMenuKeys = Tab, I, P

; Switches between Minecraft mode and Skyrim mode: Skyrim's own movement, body, HUD, weapons and
; magic. Minecraft's player follows you meanwhile and can't be hurt; your blocks stay. Health is
; carried across as a share (half your Skyrim health becomes half your Minecraft hearts). Same key
; names as above (pick one neither game uses; K is free in both by default). Empty: no switch.
sModeToggleKey = K

; Mix and match hands in Minecraft mode: equip a Skyrim weapon, spell, shield or torch in a hand
; (Skyrim's inventory or magic menu) and that hand becomes Skyrim's until you unequip it. Skyrim
; draws it and gets its mouse button (left button: right hand, right button: left hand); the other
; hand stays Minecraft's. Two-handed weapons and bows take both hands. 0 = Minecraft keeps both.
bSkyrimHands = 1

[Worlds]
; The Nether and the End: a Minecraft portal takes you into Minecraft's own world. Skyrim keeps its
; player waiting in an empty cell meanwhile and draws only Minecraft, then brings you back to Skyrim
; wherever you come out of a portal. 0 = Skyrim stays where it was (not playable there).
bMinecraftWorlds = 1

; The empty cell Skyrim waits in (a form ID in Skyrim.esm). MainMenuCell holds nothing but a marker.
iWaitingCell = 0x6F3EB

[Debug]
; Detailed timing, camera, combat and lighting logs in SkyCraft.log (several lines a second), for
; reporting problems. 0 = off.
bDiagnostics = 0
