name: Build (NeoForge 1.21.1)

# Put this file at  .github/workflows/build.yml
# and neoforge-1.21.1.patch at the repository root of your fork.
#
# On every run it applies the patch (unless the tree is already ported), builds with
# Java 21 + Gradle, and uploads the jar and the full build log. Run it manually with
# "push_patched_branch" ticked to commit the ported source to a branch you can keep
# fixing by hand.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      push_patched_branch:
        description: "Commit the patched source to the 'neoforge-1.21.1' branch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PATCH_FILE: neoforge-1.21.1.patch
  PORT_BRANCH: neoforge-1.21.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply NeoForge 1.21.1 patch
        id: patch
        run: |
          if [ -f src/main/resources/META-INF/neoforge.mods.toml ]; then
            echo "Tree is already ported to NeoForge - skipping patch."
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$PATCH_FILE" ]; then
            echo "::error::$PATCH_FILE not found in the repository root."
            exit 1
          fi
          git apply --index --whitespace=nowarn "$PATCH_FILE"
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "Patch applied: $(git diff --cached --name-only | wc -l) files changed."

      - name: Drop stale dev-run data
        run: |
          rm -rf run-data
          # The restored Gradle cache can contain old ForgeGradle 1.20.1 artifacts (some corrupt),
          # which pollute the API dump below.
          rm -rf "$HOME/.gradle/caches/forge_gradle"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          # javac stops at 100 errors by default, which hides most of the port's problems.
          cat > "$RUNNER_TEMP/allerrors.init.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
              }
          }
          EOF
          ./gradlew build --no-daemon --stacktrace -I "$RUNNER_TEMP/allerrors.init.gradle" 2>&1 | tee build.log

      - name: Dump dependency API (class lists and signatures)
        if: always()
        run: |
          mkdir -p api-dump
          find "$HOME/.gradle" "$PWD/.gradle" build -name '*.jar' ! -name '*-sources.jar' 2>/dev/null | grep -v -e forge_gradle -e '1\.20\.1' > api-dump/jars.txt || true
          CP=$(paste -sd: api-dump/jars.txt)
          for key in ha1mEyJS geckolib curios; do
            for j in $(grep -i "$key" api-dump/jars.txt); do
              echo "## $j"
              unzip -Z1 "$j" 2>/dev/null | grep '\.class$' | sed 's/\.class$//; s|/|.|g'
            done > "api-dump/classes-$key.txt"
          done
          for c in \
            net.minecraft.client.gui.screens.Screen \
            net.minecraft.client.gui.screens.inventory.AbstractContainerScreen \
            net.minecraft.client.gui.screens.inventory.CraftingScreen \
            net.minecraft.client.gui.screens.recipebook.RecipeBookComponent \
            net.minecraft.client.gui.screens.recipebook.RecipeCollection \
            net.minecraft.client.gui.screens.recipebook.RecipeBookTabButton \
            net.minecraft.client.gui.screens.recipebook.RecipeButton \
            net.minecraft.client.gui.screens.recipebook.RecipeBookPage \
            net.minecraft.client.gui.screens.recipebook.OverlayRecipeComponent \
            net.minecraft.client.gui.screens.recipebook.AbstractFurnaceRecipeBookComponent \
            net.minecraft.client.gui.screens.inventory.AbstractFurnaceScreen \
            net.minecraft.client.gui.screens.inventory.InventoryScreen \
            net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen \
            net.minecraft.client.gui.screens.PauseScreen \
            net.minecraft.client.gui.screens.OptionsScreen \
            net.minecraft.client.gui.screens.OptionsSubScreen \
            net.minecraft.client.gui.screens.ShareToLanScreen \
            net.minecraft.client.gui.components.StateSwitchingButton \
            net.minecraft.client.gui.components.ImageButton \
            net.minecraft.client.gui.components.CycleButton \
            net.minecraft.client.gui.components.AbstractWidget \
            net.minecraft.client.gui.components.Button \
            net.minecraft.client.gui.GuiGraphics \
            net.minecraft.client.gui.Gui \
            net.minecraft.world.inventory.AbstractContainerMenu \
            net.minecraft.world.inventory.InventoryMenu \
            net.minecraft.world.inventory.RecipeBookMenu \
            net.minecraft.world.inventory.CraftingMenu \
            net.minecraft.world.inventory.AbstractFurnaceMenu \
            net.minecraft.world.inventory.ResultSlot \
            net.minecraft.world.item.crafting.RecipeManager \
            net.minecraft.world.item.crafting.RecipeHolder \
            net.minecraft.world.item.crafting.CraftingInput \
            net.minecraft.world.item.crafting.CraftingRecipe \
            net.minecraft.client.ClientRecipeBook \
            net.minecraft.stats.RecipeBook \
            net.minecraft.client.gui.screens.inventory.tooltip.TooltipRenderUtil \
            net.minecraft.world.entity.player.Player \
            net.minecraft.client.player.LocalPlayer \
            net.minecraft.client.gui.screens.recipebook.GhostRecipe \
            net.minecraft.client.gui.screens.recipebook.RecipeUpdateListener \
            net.minecraft.recipebook.PlaceRecipe \
            net.minecraft.world.entity.player.StackedContents \
            net.minecraft.client.gui.components.Renderable \
            net.minecraft.client.gui.components.EditBox \
            net.minecraft.client.gui.screens.inventory.EffectRenderingInventoryScreen \
            software.bernie.geckolib.renderer.GeoItemRenderer \
            com.zigythebird.playeranim.api.PlayerAnimationFactory \
            com.zigythebird.playeranim.api.PlayerAnimationAccess \
            com.zigythebird.playeranim.animation.PlayerAnimationController \
            ; do
            javap -protected -cp "$CP" "$c" > "api-dump/$c.txt" 2>&1 || true
          done

      - name: Upload API dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: api-dump
          if-no-files-found: ignore

      - name: Summarise compile errors
        if: always()
        run: |
          {
            echo "## Build result: ${{ steps.build.outcome }}"
            echo
            if grep -qE "\.java:[0-9]+: error:" build.log; then
              echo "### Errors by message (top 40)"
              echo '```'
              grep -E "\.java:[0-9]+: error:" build.log | sed -E 's/.*error: //' | sort | uniq -c | sort -rn | head -40
              echo '```'
              echo
              echo "### Errors by file (top 40)"
              echo '```'
              grep -E "\.java:[0-9]+: error:" build.log | sed -E 's|.*/src/main/java/||; s/:[0-9]+: error:.*//' | sort | uniq -c | sort -rn | head -40
              echo '```'
              echo
              echo "Total compile errors: $(grep -cE '\.java:[0-9]+: error:' build.log)"
            elif grep -qE "Could not (resolve|find|GET)" build.log; then
              echo "### Dependency resolution problem"
              echo '```'
              grep -E "Could not (resolve|find|GET)|> Could not" build.log | head -20
              echo '```'
              echo "Check the dependency versions in gradle.properties / build.gradle."
            elif [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "Build succeeded."
            else
              echo "See the attached build.log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: penumbra_phantasm-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Push ported source to a branch
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.push_patched_branch &&
          steps.patch.outputs.applied == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PORT_BRANCH"
          git rm -q --cached "$PATCH_FILE" || true
          rm -f "$PATCH_FILE"
          git commit -m "Port to NeoForge 1.21.1 (automated patch)"
          git push --force origin "$PORT_BRANCH"
          echo "Pushed ported source to branch '$PORT_BRANCH'." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed - see the summary and build.log artifact."
          exit 1
